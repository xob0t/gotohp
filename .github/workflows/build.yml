name: Build Release

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS to build (macos, windows, linux, all)"
        required: true
        default: "all"
        type: choice
        options:
          - macos
          - windows
          - linux
          - all
      branch:
        description: "Branch to build from"
        required: true
        default: "main"
        type: string
      commit_sha:
        description: "Specific commit SHA to build (optional, overrides branch)"
        required: false
        type: string
      build_debug:
        description: "Also build debug version"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*" # Created by Release Please when the release PR is merged

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-beta.8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'macos' || inputs.os == 'all')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || (inputs.commit_sha || inputs.branch) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails3
        run: go install -v github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build macOS App (Production)
        run: |
          mkdir -p release
          wails3 doctor

          # Update build assets
          wails3 task common:update:build-assets

          # Build the app package
          wails3 task darwin:package:universal

          # Build standalone CLI binary without Wails/WebView dependencies
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags cli -trimpath -buildvcs=false -ldflags="-w -s" -o bin/gotohp-cli-amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags cli -trimpath -buildvcs=false -ldflags="-w -s" -o bin/gotohp-cli-arm64
          lipo -create -output release/gotohp-cli-macos-universal bin/gotohp-cli-amd64 bin/gotohp-cli-arm64
          rm bin/gotohp-cli-amd64 bin/gotohp-cli-arm64

          # Create zip file of the .app bundle
          cd bin
          zip -r ../release/gotohp-macos-universal.zip gotohp.app
          cd ..

      - name: Build macOS App (Debug)
        if: (github.event_name == 'workflow_dispatch' && inputs.build_debug) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        run: |
          # Clean bin directory
          rm -rf bin/gotohp.app
          rm -f bin/gotohp

          # Build debug version (creates binary, not .app)
          wails3 build DEV=true

          # Rename debug binary
          mv bin/gotohp release/gotohp-macos-universal_debug

      - name: Upload macOS Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/gotohp-macos-universal.zip
            release/gotohp-cli-macos-universal

      - name: Upload macOS Debug Artifact
        if: (github.event_name == 'workflow_dispatch' && inputs.build_debug) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: macos-debug
          path: release/gotohp-macos-universal_debug

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'windows' || inputs.os == 'all')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || (inputs.commit_sha || inputs.branch) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        shell: pwsh
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          Write-Host "Task installed successfully"

      - name: Install Wails3
        shell: cmd
        run: go install -v github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build Windows App (Production)
        shell: pwsh
        run: |
          mkdir -p release
          wails3 doctor

          # Update build assets
          task common:update:build-assets

          # Build the GUI application with production flags
          task windows:build
          Move-Item -Path "bin\gotohp.exe" -Destination "release\gotohp-x64.exe"

          # Build standalone CLI binary without Wails/WebView dependencies
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -tags cli -trimpath -buildvcs=false -ldflags="-w -s" -o "release\gotohp-cli-x64.exe"

      - name: Build Windows App (Debug)
        if: (github.event_name == 'workflow_dispatch' && inputs.build_debug) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        run: |
          # Clean bin directory
          Remove-Item -Path "bin\gotohp.exe" -ErrorAction SilentlyContinue
          Remove-Item -Path "bin\gotohp-cli.exe" -ErrorAction SilentlyContinue

          # Build GUI debug version
          wails3 build DEV=true
          Move-Item -Path "bin\gotohp.exe" -Destination "release\gotohp-x64_debug.exe"

          # Build CLI debug version without Wails/WebView dependencies
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -tags cli -buildvcs=false -gcflags=all="-l" -o "release\gotohp-cli-x64_debug.exe"

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/gotohp-x64.exe
            release/gotohp-cli-x64.exe

      - name: Upload Windows Debug Artifact
        if: (github.event_name == 'workflow_dispatch' && inputs.build_debug) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug
          path: |
            release/gotohp-x64_debug.exe
            release/gotohp-cli-x64_debug.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.os == 'linux' || inputs.os == 'all')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || (inputs.commit_sha || inputs.branch) }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install Wails3
        run: go install -v github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build Linux App (Production)
        run: |
          mkdir -p release
          wails3 doctor

          # Update build assets
          wails3 task common:update:build-assets

          # Build the application
          wails3 task package

          # Generate deb package
          wails3 tool package -name gotohp -format deb -config ./build/linux/nfpm/nfpm.yaml -out ./release

          # Build CLI binary and package without Wails/WebView dependencies
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags cli -trimpath -buildvcs=false -ldflags="-w -s" -o "bin/gotohp-cli"
          cp bin/gotohp-cli "release/gotohp-cli_amd64"
          nfpm package --packager deb --config ./build/linux/nfpm/nfpm-cli.yaml --target ./release/gotohp-cli_amd64.deb

          # Generate AppImage
          wails3 package
          mv bin/gotohp-x86_64.AppImage "release/gotohp_amd64.AppImage"
          rm -f bin/gotohp-x86_64.AppImage

          # Rename .deb file if needed
          if [ -f "release/gotohp.deb" ]; then
            mv "release/gotohp.deb" "release/gotohp_amd64.deb"
          fi

      - name: Build Linux App (Debug)
        if: (github.event_name == 'workflow_dispatch' && inputs.build_debug) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        run: |
          # Clean bin directory
          rm -f bin/gotohp

          # Build debug version
          wails3 build DEV=true

          # Copy debug binary
          cp bin/gotohp "release/gotohp_amd64_debug"

      - name: Upload Linux Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/gotohp_amd64.deb
            release/gotohp_amd64.AppImage
            release/gotohp-cli_amd64
            release/gotohp-cli_amd64.deb

      - name: Upload Linux Debug Artifact
        if: (github.event_name == 'workflow_dispatch' && inputs.build_debug) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug
          path: release/gotohp_amd64_debug

  release:
    name: Attach Release Assets
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release

      - name: Generate Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Assets to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release Please creates the release before pushing the tag; the
          # create call is a fallback for manually pushed tags.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
