name: Nix hashes

# Keeps vendorHash / npmDepsHash in nix/hashes.json in sync when Go or npm
# dependencies change (Dependabot, Renovate, or manual PRs). The package version
# needs no update here: flake.nix reads it from build/windows/info.json, which
# the Release Please workflow already regenerates on release PRs.

on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - frontend/package.json
      - frontend/package-lock.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update dependency hashes
    # Fork PRs cannot be pushed to.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          # Pushes made with the default token do not trigger other workflows;
          # use the same PAT as Release Please so nix.yml re-runs on the new commit.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - uses: cachix/install-nix-action@v31

      - name: Recompute hashes
        run: bash nix/update-hashes.sh

      - name: Commit changes
        run: |
          if git diff --quiet -- nix/hashes.json; then
            echo "Hashes already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/hashes.json
          git commit -m "chore(nix): update dependency hashes"
          git push
