name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # RELEASE_PLEASE_TOKEN must be a PAT (contents: write, pull-requests: write).
          # Tags created with the default GITHUB_TOKEN do not trigger other
          # workflows, so build.yml would never run on release without it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
